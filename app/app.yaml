name: EmbeddingGemma 2 Vision Lab
description: |
  Google EmbeddingGemma 2 running on the board: zero-shot and few-shot image
  classification from the camera, plus Edge Impulse dataset collection, label
  auditing and semantic search.
icon: 🧭
ports: []
bricks:
  - arduino:web_ui
  - embedding_gemma:
      variables:
        EMBEDDING_GEMMA_HF_REPO: ggml-org/embeddinggemma-2-GGUF:Q8_0
        EMBEDDING_GEMMA_IMAGE_MAX_TOKENS: "70"
  - edge_impulse
